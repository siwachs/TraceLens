services:
  postgres:
    image: postgres:18
    container_name: tracelens-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: tracelens
      POSTGRES_USER: tracelens
      POSTGRES_PASSWORD: tracelens_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelens -d tracelens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
