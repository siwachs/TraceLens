services:
  postgres:
    image: postgres:18
    container_name: tracelens-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: tracelens
      POSTGRES_USER: tracelens
      POSTGRES_PASSWORD: tracelens_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelens -d tracelens"]
      interval: 5s
      timeout: 5s
      retries: 10

  floci:
    image: floci/floci:latest
    container_name: tracelens-floci
    restart: unless-stopped

    environment:
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data

    ports:
      - "4566:4566"

    volumes:
      - ./docker/floci/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
